[package]
name = "rusty-claude-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "claw"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
async-trait = "0.1"
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
plugins = { path = "../plugins" }
chrono = "0.4"
cron = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono", "migrate", "macros"] }
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "signal", "time", "process", "io-util"] }
toml = "0.8"
uuid = { version = "1", features = ["v4"] }
tools = { path = "../tools" }
ignore = "0.4"
notify = { version = "6", default-features = false, features = ["macos_kqueue"] }
sha2 = "0.10"
futures = "0.3"

[lints]
workspace = true

[dev-dependencies]
mock-anthropic-service = { path = "../mock-anthropic-service" }
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"

